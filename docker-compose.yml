version: '3.8'

services:
  nuvio-mdblist-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuvio-mdblist-sync
    env_file:
      - .env
    restart: "no"  # Set to "no" if you want it to run once and exit

    # 2. Ofelia Scheduler (Triggers the sync container every night at midnight)
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: nuvio-scheduler
    depends_on:
      - nuvio-mdblist-sync
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      # Run 'docker start -a nuvio-mdblist-sync' every day at 00:00 (Midnight)
      ofelia.job-run.nuvio-daily.schedule: "0 0 0 * * *"
      ofelia.job-run.nuvio-daily.container: "nuvio-mdblist-sync"
    restart: always